name  = "worker1"
route = "clickjim.com/*"
main  = "dist/index.js"
workers_dev = true
compatibility_date = "2026-01-09"
# here
[vars]
AUTH_DEMO_EMAIL = "demo@clickjim.com"
AUTH_DEMO_PASSWORD = "change-me"
SESSION_SECRET = "change-this-in-production"

[[durable_objects.bindings]]
name = "AUTH_SESSION_DO"
class_name = "AuthSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthSessionDO"]

[build]
command = "npm install && npm run build"

[build.upload]
format = "modules"
dir = "dist"
main = "index.js"
