name  = "worker1"
route = "clickjim.com/*"
main  = "dist/index.js"
workers_dev = true
compatibility_date = "2026-01-09"
# here
[vars]
AUTH_DEMO_EMAIL = "demo@clickjim.com"
# Set AUTH_DEMO_PASSWORD and SESSION_SECRET with `wrangler secret put`.
PROJECT_AUDIO_SERVER_URL = "https://audio.clickjim.com"
# Set PROJECT_AUDIO_SERVER_SECRET to the same secret as the home server.

[[durable_objects.bindings]]
name = "AUTH_SESSION_DO"
class_name = "AuthSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthSessionDO"]

[build]
command = "npm install && npm run build"

[build.upload]
format = "modules"
dir = "dist"
main = "index.js"
